# 安卓 Vulkan 契约测试 + 模拟机型档（#429）：Ubuntu GCC + Mesa lavapipe + Khronos validation，
# 再用 VK_LAYER_KHRONOS_profiles 藏能力，跑到真机上才会走的降级 / 拒绝分支（android/tests/vk/sim_tiers.sh）。
# 触发：只在改动可能影响安卓 Vulkan 后端的目录时跑（宁可多跑）；另每天定时全量跑一次，兜住路径过滤漏掉的共享改动。
# 维护方门禁的 run.sh 只在 Mac clang、固定文件清单下跑，这里补 GCC 与模拟机型两块（#393、#402 就是因此漏掉的）。
name: android-vk
on:
  pull_request:
    paths:
      - 'android/**'
      - 'graphics/**'
      - 'platform/**'
      - 'runtime/include/**'
      - '.github/workflows/android-vk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'graphics/**'
      - 'platform/**'
      - 'runtime/include/**'
      - '.github/workflows/android-vk.yml'
  schedule:
    - cron: '23 19 * * *'   # 每天一次全量（UTC 19:23）
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-vk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 系统包（lavapipe / validation / glslc / profiles 层构建依赖）
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers vulkan-tools glslc libvulkan-dev \
            build-essential git cmake ninja-build libjsoncpp-dev python3-jsonschema python3-pyparsing
      - name: 契约测试 + 模拟机型档
        run: |
          set +e
          bash android/tests/vk/sim_tiers.sh
          rc=$?
          set -e
          if [ "$rc" -eq 75 ]; then
            # 维护方约定：环境不齐退出码 75，不记成测试失败；结论写进摘要和告警，不静默。
            echo "::warning title=android-vk 环境不齐::模拟档没跑（退出码 75），原因见日志"
            echo "### android-vk：环境不齐，模拟档未测（退出码 75）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"
